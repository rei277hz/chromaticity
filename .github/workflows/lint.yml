name: Next Blender lint

on:
  push:
    branches-ignore: [ci-status]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Next Blender formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buck2
        with:
          formatters: "true"
      - run: python3 tools/ci/format.py
      - run: python3 tools/ci/format.py --starlark-lint

  graph:
    name: Next Blender target selection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buck2
      - name: Select local execution
        run: ./remote_execution/re local
      - name: Enforce the product-only CI selection
        run: python3 tools/ci/check_targets.py
      - run: buck2 uquery //products/perceptual-grade-next-blender/...
      - run: buck2 cquery //products/perceptual-grade-next-blender/...
