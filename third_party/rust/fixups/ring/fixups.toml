# ring 0.17.14 compiles its packaged C and pregenerated assembly using the
# declared C/C++ toolchain. The archive contains all source/header inputs;
# packaged builds do not run Perl or nasm.
cargo_env = [
    "CARGO_PKG_NAME",
    "CARGO_PKG_VERSION_MAJOR",
    "CARGO_PKG_VERSION_MINOR",
    "CARGO_PKG_VERSION_PATCH",
    "CARGO_PKG_VERSION_PRE",
    "CARGO_MANIFEST_LINKS",
]

[buildscript.run]
rustc_link_lib = true
rustc_link_search = true
