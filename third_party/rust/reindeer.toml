precise_srcs = true
unresolved_fixup_error = true
vendor = false

[cargo]
bindeps = true

[buck]
generated_file_header = """
# Generated by third_party/rust/regenerate.py. Do not edit directly.
# Cargo.toml, Cargo.lock, reindeer.toml, and fixups/ are the editable inputs.
"""

[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"
execution-platform = true

[platform.macos-aarch64]
target = "aarch64-apple-darwin"
execution-platform = true

[platform.wasm32]
target = "wasm32-unknown-unknown"
execution-platform = false
