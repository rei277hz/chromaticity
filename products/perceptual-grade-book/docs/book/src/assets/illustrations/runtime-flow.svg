<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
<title id="title">Perceptual Grade model, Blender runtime, and Resolve DCTL flow</title>
<desc id="desc">The analytic reference supplies two product paths. Blender resolves Grade settings, prepares and publishes native resources, and evaluates Grade or Stack graphs. Bake and Vectorscope have feature-owned capture paths. Resolve builds six localized DCTL stages that execute in a serial node chain and return scene-linear XYZ D65.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#72736d"/></marker>
  <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#72736d" stroke-width="1.5"/></marker>
</defs>
<rect width="1200" height="770" fill="#f7f8f6"/>
