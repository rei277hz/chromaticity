  <path d="M440 150V220H300V290"/>
  <path d="M840 150V195H1140V430H1105" stroke-dasharray="7 6" marker-end="url(#arrow-open)"/>
  <path d="M300 350V395"/><path d="M300 465V510"/><path d="M300 580V620"/>
  <path d="M300 690V710H165V728"/><path d="M300 710H435V728"/>
  <path d="M900 350V395"/><path d="M900 465V510"/><path d="M900 600V645"/>
